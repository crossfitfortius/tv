html,body{height:100%;margin:0;background:#000;overflow:hidden}
body{cursor:none;-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;-webkit-transform-origin:0 0;overflow:hidden;background:#111b2c}
.slide{position:absolute;top:0;right:0;bottom:0;left:0;opacity:0;overflow:hidden;transition:opacity 1.2s ease;-webkit-transition:opacity 1.2s ease;
  background:#1b2a41;background:radial-gradient(130% 100% at 28% 0%, #27426d 0%, #1b2a41 48%, #111b2c 100%)}
.slide.on{opacity:1}

/* The logo's ring and disc, large and quiet, in the lower right corner. Blue, so text that crosses them stays readable */
.deco-a{position:absolute;left:1520px;top:760px;width:820px;height:820px;border-radius:50%;border:44px solid #3a86d6;opacity:.34;box-sizing:border-box}
.deco-b{position:absolute;left:1616px;top:856px;width:628px;height:628px;border-radius:50%;background:#125caa;opacity:.5}

/* Header and footer, the same on every slide */
.hd{position:absolute;left:0;right:0;top:0;height:160px;background:#f3f2ee}
.hd .logo{position:absolute;left:96px;top:50px;height:88px;width:auto;display:block}
.hd .tag{position:absolute;right:96px;top:80px;margin:0;font-family:"Montserrat", Arial, sans-serif;font-weight:700;font-size:28px;line-height:1;letter-spacing:.22em;text-transform:uppercase;color:#125caa;white-space:nowrap}
.hd-rule{position:absolute;left:0;right:0;top:160px;height:8px;background:#e7952f}
.ft{position:absolute;left:96px;right:96px;bottom:54px;height:24px;font-family:"Montserrat", Arial, sans-serif;font-weight:500;font-size:22px;line-height:24px;letter-spacing:.06em;color:#b4c3da;white-space:nowrap}
.ft .l{position:absolute;left:0;top:0}
.ft .r{position:absolute;right:0;top:0}
.prog{position:absolute;left:96px;bottom:36px;height:4px;width:0;border-radius:2px;background:#e7952f;transition-property:width;-webkit-transition-property:width;transition-timing-function:linear;-webkit-transition-timing-function:linear}

/* Pieces rise into place when a slide comes up */
.rz{opacity:0;transform:translateY(28px);-webkit-transform:translateY(28px);transition:opacity .6s ease, transform .6s ease;-webkit-transition:opacity .6s ease, -webkit-transform .6s ease}
.slide.on .rz{opacity:1;transform:none;-webkit-transform:none}
.d1{transition-delay:.15s;-webkit-transition-delay:.15s}
.d2{transition-delay:.3s;-webkit-transition-delay:.3s}
.d3{transition-delay:.45s;-webkit-transition-delay:.45s}
.d4{transition-delay:.6s;-webkit-transition-delay:.6s}
.d5{transition-delay:.75s;-webkit-transition-delay:.75s}

/* Shared type */
.area{position:absolute;left:96px;top:190px;width:1728px;height:800px}
.col{position:absolute;left:0;top:0}
.eyebrow{margin:0;font-family:"Montserrat", Arial, sans-serif;font-weight:700;font-size:30px;line-height:1.2;letter-spacing:.2em;text-transform:uppercase;color:#e7952f}
.title{margin:20px 0 0;font-family:"Cinzel", Georgia, serif;font-weight:700;font-size:112px;line-height:1.08;letter-spacing:.035em;text-transform:uppercase;color:#f3f2ee}
.title .tl{display:inline-block;white-space:nowrap}
.title .hot{color:#e7952f}
.rule{width:150px;height:8px;margin:30px 0 0;background:#e7952f}
.body{margin:30px 0 0}
.body p{margin:0;font-family:"Montserrat", Arial, sans-serif;font-weight:500;font-size:40px;line-height:1.34;color:#f3f2ee}
.body p + p{margin-top:16px;color:#c9d5e6}
.fine{margin:30px 0 0;font-family:"Montserrat", Arial, sans-serif;font-weight:500;font-size:27px;line-height:1.42;color:#9db0cc}

/* Plates: blue for what is coming, orange for what is next */
.plate{position:absolute;border-radius:6px;white-space:nowrap;text-align:center;
  background:#125caa;background:linear-gradient(180deg,#1a6cc2 0%,#0f529b 100%);
  box-shadow:0 4px 10px rgba(0,0,0,.35);
  font-family:"Montserrat", Arial, sans-serif;font-weight:600;color:#ffffff}
.plate.past{background:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.16);color:#647a9c}
.plate.next{background:#e7952f;background:linear-gradient(180deg,#f2a94b 0%,#de8a22 100%);color:#14213a;font-weight:700;
  box-shadow:0 0 0 5px rgba(231,149,47,.30), 0 6px 18px rgba(0,0,0,.4);
  -webkit-animation:pulse 2.4s ease-in-out infinite;animation:pulse 2.4s ease-in-out infinite}
@-webkit-keyframes pulse{0%{box-shadow:0 0 0 5px rgba(231,149,47,.30), 0 6px 18px rgba(0,0,0,.4)}50%{box-shadow:0 0 0 12px rgba(231,149,47,.14), 0 6px 18px rgba(0,0,0,.4)}100%{box-shadow:0 0 0 5px rgba(231,149,47,.30), 0 6px 18px rgba(0,0,0,.4)}}
@keyframes pulse{0%{box-shadow:0 0 0 5px rgba(231,149,47,.30), 0 6px 18px rgba(0,0,0,.4)}50%{box-shadow:0 0 0 12px rgba(231,149,47,.14), 0 6px 18px rgba(0,0,0,.4)}100%{box-shadow:0 0 0 5px rgba(231,149,47,.30), 0 6px 18px rgba(0,0,0,.4)}}
.chip{position:absolute;top:-13px;right:10px;padding:5px 9px;border-radius:4px;background:#ffffff;color:#14213a;font-style:normal;
  font-family:"Montserrat", Arial, sans-serif;font-weight:700;font-size:14px;line-height:1;letter-spacing:.12em;box-shadow:0 2px 6px rgba(0,0,0,.35)}

/* Offer tiles */
.tiles{margin:34px 0 0;white-space:nowrap}
.tile{display:inline-block;vertical-align:top;margin-right:26px;padding:24px 40px 26px;border-radius:8px;text-align:left;
  background:#125caa;background:linear-gradient(180deg,#1a6cc2 0%,#0f529b 100%);box-shadow:0 6px 16px rgba(0,0,0,.35)}
.tile .k{display:block;font-family:"Montserrat", Arial, sans-serif;font-weight:700;font-size:24px;line-height:1;letter-spacing:.14em;text-transform:uppercase;color:#d5e4f6}
.tile .v{display:block;margin-top:14px;font-family:"Cinzel", Georgia, serif;font-weight:700;font-size:84px;line-height:1;letter-spacing:.02em;color:#ffffff}
.tile .s{display:block;margin-top:14px;font-family:"Montserrat", Arial, sans-serif;font-weight:700;font-size:30px;line-height:1;color:#ffffff}
.tile.hot{background:#e7952f;background:linear-gradient(180deg,#f2a94b 0%,#de8a22 100%)}
.tile.hot .k,.tile.hot .v,.tile.hot .s{color:#14213a}

/* QR panel */
.qr{position:absolute;right:0;top:0;width:340px;text-align:center}
.qr .box{width:300px;height:300px;margin:0 auto;padding:20px;border-radius:10px;background:#ffffff;box-shadow:0 8px 22px rgba(0,0,0,.4)}
.qr img{display:block;width:300px;height:300px;image-rendering:pixelated;image-rendering:crisp-edges}
.qr .cap{margin:22px 0 0;font-family:"Montserrat", Arial, sans-serif;font-weight:700;font-size:22px;line-height:1;letter-spacing:.2em;text-transform:uppercase;color:#e7952f}

/* Schedule */
.s-title{position:absolute;left:0;top:0;margin:0;font-family:"Cinzel", Georgia, serif;font-weight:700;font-size:88px;line-height:1;letter-spacing:.05em;text-transform:uppercase;color:#f3f2ee;white-space:nowrap}
.s-date{position:absolute;right:0;margin:0;font-family:"Montserrat", Arial, sans-serif;font-weight:700;font-size:34px;line-height:1;letter-spacing:.06em;color:#e7952f;white-space:nowrap;text-align:right}

    for (i = 0; i < (s.items || []).length; i++) { if (inWindow(s.items[i], t)) out.push(s.items[i]); }
    return out;
  }
  function active(s, t) {
    if (!s || s.off) return false;
    if (!inWindow(s, t)) return false;
    if (s.type === "youtube") {
      if (!s.playlist && !(s.videos && s.videos.length)) return false;
      if (new Date().getTime() < yt.blockedUntil) return false;
    }
    if (s.type === "page") {
      if (!s.src) return false;
      if (s.probe && probeOK[s.id] !== true) return false;
    }
    if (s.type === "events" && !liveItems(s, t).length) return false;
    return true;
  }

  /* ---------- slide parts ---------- */
  function chrome(s, tagText) {
    var t = now();
    var right = (s && s.url) ? s.url : (data.site || "");
    return '<div class="deco-a"></div><div class="deco-b"></div>' +
      '<header class="hd"><img class="logo" src="' + LOGO + '" alt="CrossFit Fortius"><p class="tag">' + esc(tagText || "") + "</p></header>" +
      '<div class="hd-rule"></div><div class="prog"></div>' +
      '<footer class="ft"><span class="l">' + esc(longDate(t) + "  ·  " + clock(t)) + '</span><span class="r">' + esc(right) + "</span></footer>";
  }
  function section(cls, html) {
    var el = document.createElement("section");
    el.className = "slide " + cls;
    el.innerHTML = html;
    return el;
  }
  function qrPanel(s) {
    if (!s.qr) return "";
    return '<div class="qr rz d4"><div class="box"><img src="' + s.qr + '" alt=""></div><p class="cap">Scan for details</p></div>';
  }
  function centerY(el, h) { el.style.top = px(Math.max(0, (AREA_H - (h === undefined ? el.offsetHeight : h)) / 2)); }
  function shrink(box, lines, maxW, minPx) {
    var fs = parseFloat(box.style.fontSize) || 112, i, over, guardN = 0;
    box.style.fontSize = fs + "px";
    while (guardN++ < 60 && fs > minPx) {
      over = false;
      for (i = 0; i < lines.length; i++) { if (lines[i].offsetWidth > maxW) over = true; }
      if (!over) break;
      fs -= 2;
      box.style.fontSize = fs + "px";
    }
  }

  /* ---------- feature: ads and announcements ---------- */
  function featureSlide(s) {
    var colW = s.qr ? 1310 : AREA_W, i;
    var title = "", body = "", tiles = "";
    var lines = s.title instanceof Array ? s.title : [s.title || ""];
    var hot = s.accent === undefined ? (lines.length > 1 ? lines.length - 1 : -1) : +s.accent;
    for (i = 0; i < lines.length; i++) title += '<span class="tl' + (i === hot ? " hot" : "") + '">' + esc(lines[i]) + "</span>" + (i < lines.length - 1 ? "<br>" : "");
    for (i = 0; i < (s.body || []).length; i++) body += "<p>" + esc(s.body[i]) + "</p>";
    for (i = 0; i < (s.tiles || []).length; i++) {
      tiles += '<span class="tile' + (s.tiles[i].hot ? " hot" : "") + '"><span class="k">' + esc(s.tiles[i].k) + '</span><span class="v">' + esc(s.tiles[i].v) + '</span><span class="s">' + esc(s.tiles[i].s) + "</span></span>";
    }
    var html = chrome(s, s.tag) + '<div class="area"><div class="col" style="width:' + colW + 'px">' +
      (s.eyebrow ? '<p class="eyebrow rz d1">' + esc(s.eyebrow) + "</p>" : "") +
      '<h2 class="title rz d2" style="font-size:' + (s.tiles ? 86 : 112) + 'px">' + title + "</h2>" +
      '<div class="rule rz d2"></div>' +
      (tiles ? '<div class="tiles rz d3">' + tiles + "</div>" : "") +
      (body ? '<div class="body rz d4">' + body + "</div>" : "") +
      (s.fine ? '<p class="fine rz d5">' + esc(s.fine) + "</p>" : "") +
      "</div>" + qrPanel(s) + "</div>";
    var el = section("feature", html);
    el._layout = function () {
      var col = find(el, "col")[0], qr = find(el, "qr")[0];
      shrink(find(el, "title")[0], find(el, "tl"), colW, 56);
      centerY(col);
      if (qr) centerY(qr);
    };
    return el;
  }

  /* ---------- schedule ---------- */
  function dayPlan(d) {
    var sch = data.schedule || {}, key = ymd(d);
    var o = (sch.overrides || {})[key];
    if (o) return { groups: o.groups || [], closed: !!o.closed, note: o.note || "", name: o.name || "" };
    return { groups: ((sch.week || {})[String(d.getDay())]) || [], closed: false, note: sch.note || "", name: "" };
  }
  function lastStart(plan) {
    var last = -1, g, i, k, m;
    for (g = 0; g < plan.groups.length; g++) {
      for (i = 0; i < (plan.groups[g].times || []).length; i++) { m = mins(plan.groups[g].times[i]); if (m !== null && m > last) last = m; }
      for (k = 0; k < (plan.groups[g].ranges || []).length; k++) { m = rangeMins(plan.groups[g].ranges[k]); if (m && m[1] > last) last = m[1]; }
    }
    return last;
  }
  function scheduleSlide(s) {
    var t = now(), nowM = t.getHours() * 60 + t.getMinutes();
    var day = t, plan = dayPlan(t), isToday = true;
    if (!plan.closed && lastStart(plan) < nowM) { day = addDays(t, 1); plan = dayPlan(day); isToday = false; }
    var UNIT = 200, GAP = 18, PH = 96, y = 0, html = "", g, i, x, cls, chip, m, r, w, label;
    var nextMarked = false;

    html += '<h2 class="s-title">' + (isToday ? "Today&#39;s classes" : "Tomorrow&#39;s classes") + "</h2>";
    html += '<p class="s-date" style="top:' + (plan.name ? 12 : 30) + 'px">' + esc(longDate(day)) + "</p>";
    if (plan.name) html += '<p class="s-sub" style="top:62px">' + esc(plan.name) + "</p>";
    y = 148;

    if (plan.closed || !plan.groups.length) {
      html += '<p class="s-closed" style="top:' + (y + 40) + 'px">' + (isToday ? "No classes today" : "No classes tomorrow") + "</p>";
      y += 40 + 140;
    } else {
      /* first group gets a full row, the rest share the second row */
      for (g = 0; g < plan.groups.length; g++) {
        label = plan.groups[g].label;
        if (g <= 1) { x = 0; if (g === 1) y += 44 + PH + 56; }
        html += '<p class="g-label" style="left:' + px(x) + ";top:" + px(y) + '">' + esc(label) + "</p>";
        for (i = 0; i < (plan.groups[g].times || []).length; i++) {
          m = mins(plan.groups[g].times[i]);
          cls = ""; chip = "";
          w = g === 0 ? UNIT : 300;
          if (isToday && m !== null) {
            if (m < nowM) cls = " past";
            else if (g === 0 && !nextMarked) { cls = " next"; chip = '<i class="chip">NEXT</i>'; nextMarked = true; }
          }
          html += '<div class="plate' + cls + '" style="left:' + px(x) + ";top:" + px(y + 44) + ";width:" + w + "px;height:" + PH + "px;line-height:" + PH + 'px;font-size:38px">' + esc(plan.groups[g].times[i]) + chip + "</div>";
          x += w + GAP;
        }
        for (i = 0; i < (plan.groups[g].ranges || []).length; i++) {
          r = rangeMins(plan.groups[g].ranges[i]);
          cls = ""; chip = "";
          w = UNIT * 2 + GAP;
          if (isToday && r) {
            if (r[1] <= nowM) cls = " past";
            else if (r[0] <= nowM) { cls = " next"; chip = '<i class="chip">OPEN NOW</i>'; }
          }
          html += '<div class="plate' + cls + '" style="left:' + px(x) + ";top:" + px(y + 44) + ";width:" + w + "px;height:" + PH + "px;line-height:" + PH + 'px;font-size:36px">' + esc(plan.groups[g].ranges[i]) + chip + "</div>";
          x += w + GAP;
        }
        x += 36;
      }
      y += 44 + PH;
    }
    if (plan.note) { html += '<p class="s-note" style="top:' + px(y + 52) + ";width:" + AREA_W + 'px">' + esc(plan.note) + "</p>"; y += 52 + 42; }

    var el = section("schedule", chrome(s, "Class schedule") + '<div class="area"><div class="col rz d1" style="width:' + AREA_W + "px;height:" + y + 'px">' + html + "</div></div>");
    el._layout = function () { centerY(find(el, "col")[0], y); };
    return el;
  }

  /* ---------- holiday hours ---------- */
  function hoursSlide(s) {
    var days = s.days || [], n = days.length || 1, gap = 28, top = 132;
    var cw = (AREA_W - gap * (n - 1)) / n, today = ymd(now()), html = "", i, k, body;
    html += '<h2 class="s-title" style="font-size:80px">' + esc(s.title || "Holiday hours") + "</h2>";
    for (i = 0; i < days.length; i++) {
      body = "";
      for (k = 0; k < (days[i].lines || []).length; k++) {
        body += '<p class="c-k">' + esc(days[i].lines[k][0]) + '</p><p class="c-v">' + esc(days[i].lines[k][1]) + "</p>";
      }
      html += '<div class="card' + (days[i].date && days[i].date < today ? " past" : (days[i].date === today ? " today" : "")) + " rz d" + Math.min(i + 1, 5) + '" style="left:' + px(i * (cw + gap)) + ";top:" + top + "px;width:" + px(cw) + '">' +
        '<div class="c-head"><p class="c-day">' + esc(days[i].label) + '</p><p class="c-name">' + esc(days[i].name || "") + "</p></div>" +
        '<div class="c-body">' + body + "</div></div>";
    }
    var el = section("hours", chrome(s, s.tag || "Holiday hours") + '<div class="area"><div class="col" style="width:' + AREA_W + 'px">' + html + "</div></div>");
    el._layout = function () {
      var cards = find(el, "card"), tall = 0, j, col = find(el, "col")[0];
      for (j = 0; j < cards.length; j++) tall = Math.max(tall, cards[j].offsetHeight);
      for (j = 0; j < cards.length; j++) cards[j].style.height = tall + "px";
      col.style.height = (top + tall) + "px";
      centerY(col, top + tall);
    };
    return el;
  }

  /* ---------- events ---------- */
  function eventsSlide(s) {
    var items = liveItems(s, now()).slice(0, 4), colW = s.qr ? 1310 : AREA_W;
    var rowH = 132, gap = 26, top = 140, dateW = 250, html = "", i, y;
    html += '<h2 class="s-title" style="font-size:80px">' + esc(s.title || "Coming up") + "</h2>";
    for (i = 0; i < items.length; i++) {
      y = top + i * (rowH + gap);
      html += '<div class="e-row rz d' + Math.min(i + 1, 5) + '" style="top:' + y + "px;width:" + colW + "px;height:" + rowH + 'px">' +
        '<div class="plate e-date' + (i === 0 ? " first" : "") + '" style="width:' + dateW + "px;height:" + rowH + 'px"><span class="t">' + esc(items[i].top) + '</span><span class="m">' + esc(items[i].main) + "</span></div>" +
        '<p class="e-title" style="left:' + (dateW + 40) + 'px;top:14px">' + esc(items[i].title) + "</p>" +
        '<p class="e-detail" style="left:' + (dateW + 40) + "px;top:82px\">" + esc(items[i].detail || "") + "</p></div>";
    }
    var total = top + items.length * (rowH + gap) - gap;
    var el = section("events", chrome(s, s.tag || "Events") + '<div class="area"><div class="col" style="width:' + colW + "px;height:" + total + 'px">' + html + "</div>" + qrPanel(s) + "</div>");
    el._layout = function () {
      var qr = find(el, "qr")[0], titles = find(el, "e-title"), details = find(el, "e-detail"), j, fs;
      for (j = 0; j < titles.length; j++) {
        fs = 54;
        while (titles[j].offsetWidth > colW - dateW - 40 && fs > 34) { fs -= 2; titles[j].style.fontSize = fs + "px"; }
      }
      for (j = 0; j < details.length; j++) {
        fs = 31;
        while (details[j].offsetWidth > colW - dateW - 40 && fs > 22) { fs -= 1; details[j].style.fontSize = fs + "px"; }
      }
      centerY(find(el, "col")[0], total);
      if (qr) centerY(qr);
    };
    return el;
  }

  /* ---------- holding slide: shown behind video and embedded pages, and when nothing is scheduled ---------- */
  function holdSlide() {
    return section("holding", '<div class="hold"><img src="' + LOGO + '" alt="CrossFit Fortius"></div>');
  }

  /* ---------- YouTube, with a guard so a dead player never stalls the loop ---------- */
  function layer(id) {
    var el = document.createElement("div");
    el.className = "layer";
    el.id = id;
    stage.appendChild(el);
    return el;
  }
  function ytVars(s) {
    var v = { autoplay: 1, mute: 1, controls: 0, rel: 0, playsinline: 1, iv_load_policy: 3, disablekb: 1, fs: 0, loop: 1 };
    if (s.playlist) { v.listType = "playlist"; v.list = s.playlist; }
    else if (s.videos && s.videos.length > 1) { v.playlist = s.videos.slice(1).join(","); }
    else if (s.videos && s.videos.length === 1) { v.playlist = s.videos[0]; }
    return v;
  }
  function ytFail() {
    yt.fails++;
    if (yt.fails >= 2) { yt.blockedUntil = new Date().getTime() + 30 * 60000; yt.fails = 0; }
    step(1);
  }
  function ytState(st) {
    if (!cur || cur.type !== "youtube" || cur !== yt.slide) {
      if (st === 1) { try { yt.player.pauseVideo(); } catch (e) {} }
      return;
    }
    if (st === 1 && !yt.playing) {
      yt.playing = true; yt.started = true; yt.fails = 0;
      clearTimeout(guard);
      yt.box.className = "layer on";
      clearTimeout(timer);
      if (!frozen()) timer = setTimeout(function () { yt.advance = true; step(1); }, (cur.seconds || 90) * 1000);
    } else if (st === 0 && yt.playing) {
      yt.advance = false;
      if (!frozen()) step(1);
    }
  }
  function ytStart(s) {
    var tag, opts;
    yt.slide = s; yt.playing = false;
    if (!yt.box) { yt.box = layer("ytbox"); yt.box.innerHTML = '<div id="ytplayer"></div><div class="shield"></div>'; }
    guard = setTimeout(ytFail, (s.guard || 12) * 1000);
    if (yt.player && yt.ready) {
      try {
        yt.player.mute();
        if (yt.started && yt.advance) yt.player.nextVideo(); else yt.player.playVideo();
      } catch (e) {}
      return;
    }
    if (yt.api) return;
    yt.api = 1;
    window.onYouTubeIframeAPIReady = function () {
      try {
        opts = {
          width: "1920", height: "1080", playerVars: ytVars(s),
          events: {
            onReady: function () {
              yt.ready = true;
              try { yt.player.mute(); if (s.shuffle && s.playlist) yt.player.setShuffle(true); yt.player.playVideo(); } catch (e) {}
            },
            onStateChange: function (e) { ytState(e.data); },
            onError: function () { try { if (cur === yt.slide) yt.player.nextVideo(); } catch (e) {} }
          }
        };
        if (!s.playlist && s.videos && s.videos.length) opts.videoId = s.videos[0];
        yt.player = new window.YT.Player("ytplayer", opts);
      } catch (e) {}
    };
    tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    tag.onerror = function () { yt.api = 0; };
    document.getElementsByTagName("head")[0].appendChild(tag);
  }
  function ytStop() {
    if (yt.box) yt.box.className = "layer";
    try { if (yt.player && yt.ready) yt.player.pauseVideo(); } catch (e) {}
  }

  /* ---------- embedded page, used for the Grit Club board ---------- */
  function pageStart(s) {
    var p = pages[s.id];
    if (!p) {
      p = pages[s.id] = layer("page-" + s.id);
      p.innerHTML = '<iframe src="' + esc(s.src) + '" scrolling="no" title=""></iframe><div class="shield"></div>';
    }
    setTimeout(function () { if (cur === s) p.className = "layer on"; }, 1500);
  }
  function pagesStop() {
    var k;
    for (k in pages) { if (pages.hasOwnProperty(k)) pages[k].className = "layer"; }
  }
  function probe() {
    var list = data.slides || [], i;
    function one(s) {
      get(s.probe + (s.probe.indexOf("?") < 0 ? "?" : "&") + "ts=" + new Date().getTime(), function (txt) { probeOK[s.id] = !!txt; });
    }
    for (i = 0; i < list.length; i++) {
      if (list[i].type === "page" && list[i].probe && inWindow(list[i], now())) one(list[i]);
    }
  }

  /* ---------- the loop ---------- */
  function frozen() { return location.hash.length > 1; }
  function render(s) {
    if (!s) return holdSlide();
    if (s.type === "feature") return featureSlide(s);
    if (s.type === "schedule") return scheduleSlide(s);
    if (s.type === "hours") return hoursSlide(s);
    if (s.type === "events") return eventsSlide(s);
    return holdSlide();
  }
  function present(s) {
    var el, old = curEl, bar, secs = (s && s.seconds) || data.seconds || 14;
    clearTimeout(timer); clearTimeout(guard);
    ytStop(); pagesStop();
    cur = s;
    try { el = render(s); } catch (e) { el = holdSlide(); }
    stage.appendChild(el);
    try { if (el._layout) el._layout(); } catch (e2) {}
    el.offsetWidth; /* settle layout before the fade */
    el.className += " on";
    curEl = el;
    bar = find(el, "prog")[0];
    if (bar && s && !frozen()) {
      bar.style.transitionDuration = secs + "s";
      bar.style.webkitTransitionDuration = secs + "s";
      setTimeout(function () { bar.style.width = "1728px"; }, 80);
    }
    if (old) setTimeout(function () { if (old.parentNode) old.parentNode.removeChild(old); }, 1500);
    document.documentElement.setAttribute("data-slide", s ? s.id : "holding");
    if (s && s.type === "youtube") { ytStart(s); return; }
    if (s && s.type === "page") pageStart(s);
    if (!frozen()) timer = setTimeout(function () { step(1); }, secs * 1000);
  }
  function step(dir) {
    var list = data.slides || [], n = list.length, t = now(), k, i;
    if (online && !frozen() && new Date().getTime() - bootedAt > 6 * 3600 * 1000) {
      bootedAt = new Date().getTime();
      get(location.pathname + "?ts=" + bootedAt, function (txt) { if (txt) location.reload(); });
    }
    for (k = 1; k <= n; k++) {
      i = (((cursor + dir * k) % n) + n) % n;
      if (active(list[i], t)) { cursor = i; present(list[i]); return; }
    }
    present(null);
    if (!frozen()) { clearTimeout(timer); timer = setTimeout(function () { step(1); }, 30000); }
  }
  function showById(id) {
    var list = data.slides || [], i;
    for (i = 0; i < list.length; i++) { if (list[i].id === id) { cursor = i; present(list[i]); return true; } }
    return false;
  }
  function refresh() {
    get("tv.json?ts=" + new Date().getTime(), function (txt) {
      var j;
      if (!txt) return;
      try { j = JSON.parse(txt); } catch (e) { return; }
      if (j && j.slides && j.slides.length && JSON.stringify(j) !== JSON.stringify(data)) { data = j; probe(); }
    });
  }
  function begin() {
    var at = query("at"), d, id = location.hash.replace("#", "");
    if (at) { d = parseDT(at); if (d) offset = d.getTime() - new Date().getTime(); }
    fit();
    if (!(id && showById(id))) step(1);
    document.documentElement.setAttribute("data-ready", "1");
    if (online) {
      refresh(); probe();
      setInterval(refresh, 10 * 60 * 1000);
      setInterval(probe, 10 * 60 * 1000);
    }
    if (!frozen() && !at && (!cal.done || /[?&]setup\b/.test(location.search))) openSetup();
    if (!reduce) {
      var offsets = [[0, 0], [4, 3], [-3, 4], [3, -4], [-4, -3]], k = 0;
      setInterval(function () { k = (k + 1) % offsets.length; drift = offsets[k]; fit(); }, 180000);
    }
  }

  window.addEventListener("resize", fit);
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener("resize", fit);
    window.visualViewport.addEventListener("scroll", fit);
  }
  window.addEventListener("hashchange", function () {
    var id = location.hash.replace("#", "");
    if (!(id && showById(id))) step(1);
  });
  document.addEventListener("click", function () { if (!setupEl) step(1); });
  document.addEventListener("keydown", function (e) {
    var c = e.keyCode, map = { 49: "smaller", 97: "smaller", 51: "bigger", 99: "bigger", 53: "done", 101: "done", 13: "done", 48: "reset", 96: "reset", 37: "left", 38: "up", 39: "right", 40: "down" };
    if (setupEl) {
      if (map[c]) { setupAct(map[c]); if (e.preventDefault) e.preventDefault(); }
      return;
    }
    if (e.key === "ArrowRight" || e.key === " " || e.keyCode === 39 || e.keyCode === 32) step(1);
    if (e.key === "ArrowLeft" || e.keyCode === 37) step(-1);
  });

  loadCal();
  fit();
  if (document.fonts && document.fonts.load) {
    Promise.all([document.fonts.load("600 40px Montserrat"), document.fonts.load("500 40px Montserrat"), document.fonts.load("700 40px Cinzel")]).then(begin, begin);
  } else {
    setTimeout(begin, 600);
  }
})();
</script>
